<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#357E66"/>
      <stop offset="55%" stop-color="#2B6B56"/>
      <stop offset="100%" stop-color="#1E4E3E"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F2EAE0"/>
    </linearGradient>
    <linearGradient id="sprout" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8D47A"/>
      <stop offset="100%" stop-color="#E2A43B"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Subtle warm journal notebook card -->
  <rect x="236" y="216" width="552" height="592" rx="108" fill="url(#paper)"/>
  <!-- Left binding spine accent -->
  <rect x="236" y="216" width="84" height="592" rx="42" fill="#E6DCCB"/>
  <rect x="292" y="216" width="28" height="592" fill="#E6DCCB"/>
  <!-- Minimalist ledger lines at bottom -->
  <rect x="372" y="616" width="320" height="28" rx="14" fill="#D9CEBC"/>
  <rect x="372" y="680" width="216" height="28" rx="14" fill="#E4DBCC"/>
  <!-- Young rice sprout / "小禾" emblem -->
  <path d="M532 544 C532 456, 532 392, 532 346" stroke="#2B6B56" stroke-width="34" stroke-linecap="round" fill="none"/>
  <!-- Left tender leaf -->
  <path d="M530 468 C450 462, 396 410, 398 344 C462 344, 518 392, 530 468 Z" fill="#3B8D71"/>
  <!-- Right golden wheat leaf -->
  <path d="M534 426 C552 346, 616 296, 690 302 C684 374, 622 426, 534 426 Z" fill="url(#sprout)"/>
  <!-- Top bud dot -->
  <circle cx="532" cy="316" r="24" fill="#E2A43B"/>
</svg>
